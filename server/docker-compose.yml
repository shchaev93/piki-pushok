# Сервер Пушка на прод-машине Энвелы: отдельный каталог /opt/pushok и свой compose.
# Наружу его отдает Caddy Энвелы по имени контейнера через общую сеть envela_edge
# (так же устроены соседние проекты). Своих портов наружу контейнер не открывает.
services:
  pushok-api:
    build: .
    container_name: pushok-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    networks:
      - edge

networks:
  edge:
    external: true
    name: envela_edge
